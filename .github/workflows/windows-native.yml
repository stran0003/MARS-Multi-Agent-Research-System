name: Windows native CPU launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/windows-native/**'
      - 'configs/windows_native.yaml'
      - 'configs/zcode_runtime.yaml'
      - 'backend/app/harness/agent_loop/zcode/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'frontend/package-lock.json'
      - '.github/workflows/windows-native.yml'

jobs:
  native-cpu:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 contracts
        shell: powershell
        run: .\deploy\windows-native\Test-NativeScripts.ps1
      - name: PowerShell 7 contracts
        shell: pwsh
        run: .\deploy\windows-native\Test-NativeScripts.ps1
      - name: Real one-click CMD dependency installation
        shell: pwsh
        run: |
          cmd /c "echo. | install-mars-windows.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real frontend and backend startup without a model call
        shell: powershell
        run: |
          cmd /c "echo. | MARS-Windows.cmd -NoBrowser -SkipConfigure"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $health = Invoke-RestMethod http://127.0.0.1:8010/health
          if ($health.service -ne 'mars-backend') { throw 'Wrong backend' }
          Invoke-RestMethod http://127.0.0.1:3001/api/system/version
          Invoke-RestMethod http://127.0.0.1:3001/api/projects
      - name: Restart reuses dependencies and validates the real ZCode protocol
        shell: powershell
        run: |
          $receipt = Get-Item dependencies/windows/installed.json
          $installed = $receipt.LastWriteTimeUtc
          .\deploy\windows-native\Mars.ps1 -Action Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\deploy\windows-native\Mars.ps1 -Action Start -NoBrowser -SkipConfigure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $receipt.FullName).LastWriteTimeUtc -ne $installed) { throw 'Startup unnecessarily reinstalled dependencies' }
          Invoke-RestMethod http://127.0.0.1:3001/api/projects
      - name: Stop owned services
        if: always()
        shell: powershell
        run: .\deploy\windows-native\Mars.ps1 -Action Stop
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-logs
          path: local/windows/logs/
