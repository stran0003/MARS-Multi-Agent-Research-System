name: Windows offline transfer package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package and windows-offline branch
        type: boolean
        default: false
      release_tag:
        description: Versioned offline release tag
        type: string
        default: windows-offline-20261023
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/windows-native/**'
      - 'backend/app/execution/local/**'
      - 'backend/app/harness/agent_loop/zcode/config.py'
      - 'backend/app/harness/persistence.py'
      - 'backend/tests/unit/test_local_durable_runner.py'
      - 'scripts/release/build_windows_offline.py'
      - 'scripts/release/build_windows_core.py'
      - 'scripts/release/v30_tree_allowlist.txt'
      - 'uv.lock'
      - 'frontend/package-lock.json'
      - '.github/workflows/windows-offline.yml'

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve committed source bytes for dependency fingerprints
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build host tools
        shell: powershell
        run: |
          python -m pip install 'uv==0.11.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import subprocess, sys, tomllib
          lock = tomllib.load(open('uv.lock', 'rb'))
          packages = [item['name'] + '==' + item['version'] for item in lock['package'] if item['name'] in {'pyyaml', 'packaging'}]
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', *packages], check=True)
          '@ | python -
      - name: Cache immutable Windows dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mars-dependency-cache
          key: windows-offline-${{ hashFiles('uv.lock', 'frontend/package-lock.json', 'configs/windows_native.yaml', 'scripts/release/build_windows_offline.py', 'scripts/release/build_windows_core.py') }}
      - name: Assemble real Windows dependencies and clean source
        shell: powershell
        run: |
          $cache = "$env:RUNNER_TEMP\mars-dependency-cache"
          $prepared = Join-Path $cache 'offline'
          $arguments = @('scripts/release/build_windows_offline.py', '--source', '.', '--source-profile', 'repository', '--output', "$env:RUNNER_TEMP\mars-offline", '--version', $env:GITHUB_SHA)
          if (Test-Path -LiteralPath (Join-Path $prepared 'manifest.json')) {
              $arguments += @('--prepared-dependencies', $prepared)
          } else {
              $arguments += @('--download-cache', (Join-Path $cache 'downloads'), '--sevenzip', "$env:ProgramFiles\7-Zip\7z.exe")
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $prepared)) {
              New-Item -ItemType Directory -Path $cache -Force | Out-Null
              Copy-Item -LiteralPath "$env:RUNNER_TEMP\mars-offline\MARS-Product\dependencies\offline" -Destination $prepared -Recurse
          }
          python scripts/release/prepare_windows_distribution.py --archive "$env:RUNNER_TEMP\mars-offline\MARS-Product-Windows-Offline.zip" --output "$env:RUNNER_TEMP\mars-distribution"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 5.1 syntax and filesystem contracts
        shell: powershell
        run: .\deploy\windows-native\Test-NativeScripts.ps1
      - name: Actual first install with dependency clients offline
        shell: powershell
        run: |
          $env:UV_OFFLINE = '1'
          $env:UV_NO_PYTHON_DOWNLOADS = '1'
          $env:npm_config_offline = 'true'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = '127.0.0.1,localhost'
          cmd.exe /d /c "call `"$env:RUNNER_TEMP\mars-distribution\install-mars-windows.cmd`" < nul"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real CPU tasks, descendants, deadlines and stop after owner exit
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\mars-distribution"
          $env:MARS_RUNTIME_ROOT = $root
          $env:PYTHONPATH = "$root\backend"
          & "$root\dependencies\windows\venv\Scripts\python.exe" -m pytest backend/tests/unit/test_local_durable_runner.py backend/tests/unit/test_windows_offline_distribution.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual offline frontend, API proxy, ZCode readiness and repeated startup
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\mars-distribution"
          $env:MARS_RUNTIME_ROOT = $root
          cmd.exe /d /c "call `"$root\MARS-Windows.cmd`" -NoBrowser -SkipConfigure < nul"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $health = Invoke-RestMethod http://127.0.0.1:8010/health
          if ($health.service -ne 'mars-backend') { throw 'Wrong backend identity' }
          $null = Invoke-RestMethod http://127.0.0.1:3001/api/system/version
          $projects = Invoke-RestMethod http://127.0.0.1:3001/api/projects
          & "$root\deploy\windows-native\Mars.ps1" -Action Start -NoBrowser -SkipConfigure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ first_install_offline = $true; windows_x64 = $true; actual_cpu_tasks_checked = $true;
             git_binary_pieces_reassembled_and_verified = $true;
             frontend_proxy_checked = $true; repeated_start_checked = $true; model_requests = 0;
             full_research_model_run_checked = $false } | ConvertTo-Json | Set-Content "$root\WINDOWS-VERIFICATION.json" -Encoding UTF8
      - name: Actual offline core update retains dependencies, configuration and research data
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\mars-distribution"
          $python = "$root\dependencies\windows\venv\Scripts\python.exe"
          $original = "$env:RUNNER_TEMP\MARS-Core-Original.zip"
          $changed = "$env:RUNNER_TEMP\MARS-Core-Changed.zip"
          $release = "$env:RUNNER_TEMP\core-update-probe"
          $env:UV_OFFLINE = '1'
          $env:UV_NO_PYTHON_DOWNLOADS = '1'
          $env:npm_config_offline = 'true'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = '127.0.0.1,localhost'
          & $python "$env:GITHUB_WORKSPACE\scripts\release\build_windows_core.py" --source $env:GITHUB_WORKSPACE --output $original --version $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $original -DestinationPath $release
          $env:MARS_CI_CORE_RELEASE = $release
          @'
          import os
          from pathlib import Path
          path = Path(os.environ['MARS_CI_CORE_RELEASE']) / 'frontend/src/app/layout.tsx'
          text = path.read_text(encoding='utf-8')
          assert 'title: "MARS' in text
          path.write_text(text.replace('title: "MARS', 'title: "MARS-CORE-CI-PROBE', 1), encoding='utf-8')
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python "$env:GITHUB_WORKSPACE\scripts\release\build_windows_core.py" --source $release --output $changed --version ($env:GITHUB_SHA + '-offline-probe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sentinels = @('projects/ci-existing-project/preserved.txt', 'workspace/ci-existing-data.txt', 'runs/ci-existing-result/preserved.txt')
          foreach ($name in $sentinels) {
              $file = Join-Path $root $name
              New-Item -ItemType Directory -Force -Path (Split-Path $file) | Out-Null
              [IO.File]::WriteAllText($file, 'Actual preservation sentinel; not a scientific result.')
          }
          Add-Content -LiteralPath "$root\configs\models.yaml" -Value "`n# Windows CI preserved user configuration."
          $protected = @('dependencies/windows/installed.json', 'dependencies/windows/venv/Scripts/python.exe',
              'dependencies/windows/venv/Lib/site-packages/filelock/__init__.py', 'configs/models.yaml',
              'WINDOWS-OFFLINE.json', 'dependencies/offline/manifest.json') + $sentinels
          $before = @{}
          foreach ($name in $protected) {
              $file = Join-Path $root $name
              $before[$name] = @{ sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash;
                  write_ticks = [IO.File]::GetLastWriteTimeUtc($file).Ticks }
          }
          $oldBuild = [IO.File]::ReadAllText("$root\frontend\.next\BUILD_ID")
          $oldFrontendStamp = (Get-FileHash -LiteralPath "$root\local\windows\frontend-build.json" -Algorithm SHA256).Hash
          & "$root\deploy\windows-native\Update.ps1" -Source $changed -NoBrowser -SkipConfigure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $protected) {
              $file = Join-Path $root $name
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$name].sha256 -or
                  [IO.File]::GetLastWriteTimeUtc($file).Ticks -ne $before[$name].write_ticks) {
                  throw "Core update changed a preserved dependency or user file: $name"
              }
          }
          $newBuild = [IO.File]::ReadAllText("$root\frontend\.next\BUILD_ID")
          $newFrontendStamp = (Get-FileHash -LiteralPath "$root\local\windows\frontend-build.json" -Algorithm SHA256).Hash
          if ($newBuild -eq $oldBuild -or $newFrontendStamp -eq $oldFrontendStamp) { throw 'Changed frontend source was not rebuilt.' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/projects
          if ($page.Content -notmatch 'MARS-CORE-CI-PROBE') { throw 'Running frontend did not serve the updated source.' }
          $health = Invoke-RestMethod http://127.0.0.1:8010/health
          if ($health.service -ne 'mars-backend') { throw 'Updated backend failed health.' }
          & "$root\deploy\windows-native\Update.ps1" -Source $original -NoBrowser -SkipConfigure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in $protected) {
              $file = Join-Path $root $name
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$name].sha256 -or
                  [IO.File]::GetLastWriteTimeUtc($file).Ticks -ne $before[$name].write_ticks) {
                  throw "Repeated core update changed a preserved file: $name"
              }
          }
          $restored = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/projects
          if ($restored.Content -match 'MARS-CORE-CI-PROBE') { throw 'Original core source was not restored.' }
          @{ windows_x64 = $true; core_updates_offline = 2; protected_files = $before;
             original_build_id = $oldBuild; changed_build_id = $newBuild;
             frontend_rebuild_and_served_source_verified = $true; model_requests = 0;
             dependency_reinstall = $false; real_research_training_checked = $false } |
              ConvertTo-Json -Depth 6 | Set-Content "$root\CORE-UPDATE-VERIFICATION.json" -Encoding UTF8
      - name: Stop owned services
        if: always()
        shell: powershell
        run: |
          $script = "$env:RUNNER_TEMP\mars-distribution\deploy\windows-native\Mars.ps1"
          if (Test-Path $script) { & $script -Action Stop }
      - name: Prepare public verified ZIP and matching core update
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\mars-distribution"
          $archive = "$env:RUNNER_TEMP\mars-offline\MARS-Product-Windows-Offline.zip"
          $env:MARS_VERIFIED_DISTRIBUTION = $root
          $env:MARS_VERIFIED_ARCHIVE = $archive
          @'
          import hashlib, os, zipfile
          from pathlib import Path
          root = Path(os.environ['MARS_VERIFIED_DISTRIBUTION'])
          archive = Path(os.environ['MARS_VERIFIED_ARCHIVE'])
          with zipfile.ZipFile(archive, 'a', zipfile.ZIP_DEFLATED) as package:
              for name in ('WINDOWS-VERIFICATION.json', 'CORE-UPDATE-VERIFICATION.json'):
                  package.write(root / name, 'MARS-Product/' + name)
          with archive.open('rb') as stream:
              checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
          (archive.parent / 'SHA256SUMS.txt').write_text(checksum + '  ' + archive.name + '\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/build_windows_core.py --source $env:GITHUB_WORKSPACE --output "$env:RUNNER_TEMP\mars-offline\MARS-Core-Update.zip" --version $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-offline-verification
          path: |
            ${{ runner.temp }}/mars-distribution/local/windows/logs/
            ${{ runner.temp }}/mars-distribution/WINDOWS-VERIFICATION.json
            ${{ runner.temp }}/mars-distribution/CORE-UPDATE-VERIFICATION.json
          if-no-files-found: ignore
      - name: Verified source and dependency package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mars-windows-offline-package
          path: |
            ${{ runner.temp }}/mars-offline/MARS-Product-Windows-Offline.zip
            ${{ runner.temp }}/mars-offline/MARS-Core-Update.zip
            ${{ runner.temp }}/mars-offline/SHA256SUMS.txt
          compression-level: 0

  publish:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'stran0003/MARS-Multi-Agent-Research-System'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mars-windows-offline-package
          path: ${{ runner.temp }}/verified-offline
      - name: Publish actual dependency bytes on windows-offline and attach full ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^windows-offline-[0-9]{8}(-[0-9]+)?$ ]]
          cd "$RUNNER_TEMP/verified-offline"
          sha256sum --check SHA256SUMS.txt
          python "$GITHUB_WORKSPACE/scripts/release/prepare_windows_distribution.py" --archive MARS-Product-Windows-Offline.zip --output "$RUNNER_TEMP/windows-publication"
          gh auth setup-git
          cd "$RUNNER_TEMP/windows-publication"
          git init -b windows-offline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          git remote add origin "$remote"
          old=$(git ls-remote origin refs/heads/windows-offline | cut -f1)
          parent="$GITHUB_SHA"
          if [ -n "$old" ]; then parent="$old"; fi
          git fetch --depth=1 origin "$parent"
          git add --force --all
          tree=$(git write-tree)
          commit=$(printf 'Verified Windows offline %s (source %s)\n' "$RELEASE_TAG" "$GITHUB_SHA" | git commit-tree "$tree" -p "$parent")
          git update-ref refs/heads/windows-offline "$commit"
          git push origin HEAD:refs/heads/windows-offline
          cd "$RUNNER_TEMP/verified-offline"
          printf 'Windows x64 CPU offline package. Extract MARS-Product and double-click MARS-Windows.cmd. Python, Node, Git, PyTorch CPU, ZCode and locked Python/npm dependencies are included. Configure your own model API in Settings.\n\nVerified on a fresh Windows runner with dependency clients offline and external proxies disabled: install, real CPU process lifecycle tests, ZCode protocol, frontend/project APIs, repeated start and two core updates. No model requests or scientific training.\n\nSource commit: %s\nDependency branch: https://github.com/%s/tree/windows-offline\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > release-notes.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MARS Windows offline $RELEASE_TAG" --notes-file release-notes.txt MARS-Product-Windows-Offline.zip MARS-Core-Update.zip SHA256SUMS.txt
